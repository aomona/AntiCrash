import org.gradle.language.jvm.tasks.ProcessResources

def repository = rootProject.file("../..")
def generated = new File(repository, "build/stonecutter/${project.minecraft_version}/generated/stonecutter")

// Stonecutter needs Gradle 9; targets retain their tested Gradle/Loom combinations.
def prepare = tasks.register("prepareVersionSources", Exec) {
    workingDir repository
    commandLine "sh", new File(repository, "gradlew"), "--no-daemon", "--console=plain",
            ":${project.minecraft_version}:prepareSources"
    inputs.files(fileTree(new File(repository, "src")), fileTree("src"))
    inputs.files(["settings.gradle", "stonecutter.gradle", "stonecutter-target.gradle",
                  "gradle.properties", "versions.json", "gradle/wrapper/gradle-wrapper.properties"]
            .collect { new File(repository, it) })
    outputs.dir(generated)
}
sourceSets.configureEach { sourceSet ->
    sourceSet.java.setSrcDirs([new File(generated, "${sourceSet.name}/java")])
    sourceSet.resources.setSrcDirs([new File(generated, "${sourceSet.name}/resources"),
                                   file("src/${sourceSet.name}/resources")])
}
tasks.withType(JavaCompile).configureEach { dependsOn prepare }
tasks.withType(ProcessResources).configureEach { dependsOn prepare }
tasks.withType(Jar).configureEach { dependsOn prepare }
tasks.register("verifySourceLayout") { dependsOn prepare }
tasks.named("check") { dependsOn tasks.named("verifySourceLayout") }
